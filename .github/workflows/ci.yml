name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Une nouvelle poussee annule la precedente sur la meme branche : inutile de
# payer deux fois la meme verification.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — build et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer le JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # Les tests tournent sur H2 en memoire : aucun service MySQL a demarrer.
      - name: Tests
        working-directory: backend
        run: mvn -B verify

      - name: Publier le rapport de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-tests-backend
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

  frontend:
    name: Frontend — build et verification TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dependances
        working-directory: frontend
        run: npm ci

      - name: Analyse statique
        working-directory: frontend
        run: npm run lint

      # tsc -b en mode strict, puis bundle de production : une erreur de type
      # casse la chaine ici et non a l'execution.
      - name: Build
        working-directory: frontend
        run: npm run build

  mobile:
    name: Mobile — analyse et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Installer les dependances
        working-directory: mobile
        run: flutter pub get

      - name: Analyse statique
        working-directory: mobile
        run: flutter analyze

      - name: Tests
        working-directory: mobile
        run: flutter test

  images:
    name: Images Docker
    runs-on: ubuntu-latest
    # On ne construit les images que si le code compile et passe les tests.
    needs: [backend, frontend]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        module: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Preparer Buildx
        uses: docker/setup-buildx-action@v3

      # Publication seulement sur push : une pull request construit l'image
      # pour verifier qu'elle se batit, sans rien publier.
      - name: Authentification au registre GitHub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Etiquettes de l'image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.module }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Construire et publier
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.module }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache porte par le registre : les builds suivants repartent
          # des couches deja construites.
          cache-from: type=gha
          cache-to: type=gha,mode=max
