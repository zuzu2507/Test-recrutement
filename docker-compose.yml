# Pile complete en local : base, API et interface web.
#
#   docker compose up -d --build     toute la pile, interface sur :3000
#   docker compose up -d mysql       la base seule, pour developper avec l'IDE
#   docker compose --profile tools up -d   ajoute Adminer sur :8081
services:
  mysql:
    image: mysql:8.0
    container_name: taskmanager-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: taskmanager
      MYSQL_USER: taskuser
      MYSQL_PASSWORD: taskpassword
    # Port 3307 cote hote pour ne pas entrer en conflit avec un MySQL
    # deja installe sur la machine.
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: taskmanager-backend
    restart: unless-stopped
    # Attend que la base reponde vraiment, pas seulement que le conteneur
    # soit lance : Hibernate echouerait a se connecter trop tot.
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ""
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: taskmanager
      DB_USERNAME: taskuser
      DB_PASSWORD: taskpassword
      JWT_SECRET: ${JWT_SECRET:-secret-de-developpement-a-remplacer-32-caracteres}
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  frontend:
    build:
      context: ./frontend
    container_name: taskmanager-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      PORT: 8080
      # Nginx relaie /api vers le backend : le navigateur ne voit qu'une
      # seule origine, donc aucun CORS en production.
      API_URL: http://backend:8080
    ports:
      - "3000:8080"

  adminer:
    image: adminer:5
    container_name: taskmanager-adminer
    restart: unless-stopped
    profiles: ["tools"]
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: mysql
      ADMINER_DESIGN: dracula
    ports:
      - "8081:8080"

volumes:
  mysql-data:
