spring:
  application:
    name: task-manager-api

  # Profil par defaut : la base MySQL de docker-compose.yml (port 3307).
  # Surchargeable sans toucher au code :
  #   SPRING_PROFILES_ACTIVE=local   -> MySQL installe sur la machine (port 3306)
  #   SPRING_PROFILES_ACTIVE=prod    -> configuration par variables d'environnement
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:docker}

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:taskmanager}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: ${SHOW_SQL:false}

  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

app:
  jwt:
    # 32 caracteres minimum (HS256). A surcharger par la variable JWT_SECRET en production.
    secret: ${JWT_SECRET:dev-secret-a-remplacer-absolument-en-production-32c}
    # 24 heures
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.taskmanager: ${LOG_LEVEL:INFO}
